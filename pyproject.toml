[project]
name = "agenticos"
version = "0.1.0"
description = "AgenticOS Phase Zero — synthetic hostile-worker + sandbox conformance harness"
requires-python = ">=3.12"
# Runtime code is standard-library only. Do not add runtime dependencies here.

[project.scripts]
agenticos-demo = "agenticos.orchestration.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "jsonschema>=4.20,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "cgroup_linux: integration tests requiring Linux cgroup v2 + systemd user scopes (run inside Ubuntu WSL2)",
    "fs_isolation_linux: filesystem-isolation experiments requiring Linux (Landlock and/or bubblewrap + namespaces)",
    "m4a_linux: serialized real-host M4A namespace/runtime-boundary tests",
    "m4b_linux: serialized real-host M4B capability-transport tests",
]
